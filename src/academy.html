<meta charset="utf-8">
<title>SN Pétanque · Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* SN Pétanque Academy. Same look as the competition desk: compact app bar, one working column, bottom tab bar on phones. */
:root{
  --bg:#eceeea; --surface:#ffffff; --surface-2:#f5f6f3; --ink:#1a2320; --muted:#5d6a64; --line:#d3d9d5;
  --accent:#1d6a54; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --jack:#d48d0b; --jack-ink:#8a5a00; --jack-soft:#fbefd6; --danger:#b3261e; --danger-soft:#f8e0de; --wire:#b9c3be;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --surface-2:#202825; --ink:#e5ebe8; --muted:#97a49e; --line:#2d3833;
  --accent:#5fc19d; --accent-ink:#0b1511; --accent-soft:#1f3a30;
  --jack:#f0b443; --jack-ink:#f0b443; --jack-soft:#3a2f17; --danger:#ef7a70; --danger-soft:#3d1f1d; --wire:#3e4b45; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1}.brand-name{white-space:nowrap}
.memorial{font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.hdr-tools{display:flex;gap:8px;align-items:center}
.netdot{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.netdot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wire)}
.netdot.live::before{background:var(--accent)}.netdot.sync::before{background:var(--jack)}.netdot.off::before{background:var(--danger)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .t-ic{display:none}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:26px}h3{font-size:19px}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.soft{background:var(--accent-soft);border-color:var(--accent)}
.panel.warn{background:var(--jack-soft);border-color:var(--jack)}
.panel.bad{background:var(--danger-soft);border-color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-height:44px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;min-height:34px}
.btn.wide{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.now{background:var(--jack-soft);color:var(--jack-ink)}
.pill.fail{background:var(--danger-soft);color:var(--danger)}
.pill.lock{border:1px dashed var(--line)}
.notice{padding:10px 14px;border-radius:8px;background:var(--jack-soft);color:var(--ink);font-size:14px}
.notice.good{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
/* levels */
.levels{display:grid;gap:12px}
.level{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:inherit}
.level:hover{border-color:var(--muted)}
.level.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.level.passed{border-color:var(--accent)}
.level .lv-n{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);flex:none}
.level.passed .lv-n{background:var(--accent);color:var(--accent-ink)}
.level.now .lv-n{background:var(--jack-soft);color:var(--jack-ink)}
.level .lv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.level .lv-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.level .lv-title b{font-family:var(--display);font-size:21px;font-weight:700}
.bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.bar-fill.jack{background:var(--jack)}
.strand{display:flex;flex-direction:column;gap:8px}
.strand-h{display:flex;align-items:center;gap:10px}
.strand-h .bar-track{flex:1;max-width:160px}
.lesson-row{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;color:inherit;min-height:44px}
.lesson-row:hover{border-color:var(--muted)}
.lesson-row .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.lesson-row.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lesson-row .lr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.lesson-row .lr-title{font-weight:600}
.lesson-row .lr-meta{font-size:12px;color:var(--muted)}
.lesson-row.drill .tick{border-radius:6px}
/* lesson */
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .vplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.6));border:0;cursor:pointer;font:inherit;text-align:center;padding:16px}
.video .vplay .vp-ic{width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.video .vplay b{font-family:var(--display);font-size:20px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.prose p{margin:0}.prose h3{margin-top:6px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tipbox{padding:10px 14px;border-radius:8px;background:var(--jack-soft);border-left:3px solid var(--jack);font-size:14px}
.keypoints{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.keypoints ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
/* drills */
.numpad{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.numpad button{min-height:64px;font-family:var(--display);font-size:28px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.numpad button:hover{border-color:var(--accent)}
.numpad button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.setchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;cursor:pointer}
.setchip.cur{border-color:var(--accent);background:var(--accent-soft)}
.big{font-family:var(--display);font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.shots{display:flex;flex-direction:column;gap:6px}
.shot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.shot.cur{border-color:var(--accent);background:var(--accent-soft)}
.shot>div:first-child{font-size:14px;line-height:1.25}
.shot .sc-btns{display:flex;gap:4px}
.shot .sc-btns button{min-width:44px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;cursor:pointer}
.shot .sc-btns button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result-card{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dots{display:inline-flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.p{background:var(--accent)}.dots i.f{background:var(--danger)}
/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;color:inherit}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt .ol{font-family:var(--display);font-weight:700;width:22px;flex:none}
.scene{width:100%;max-width:420px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.stat b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;padding:10px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;text-align:center}
.badge .bd{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.badge.on .bd{background:var(--accent);color:var(--accent-ink)}
.badge.skip .bd{background:var(--jack-soft);color:var(--jack-ink)}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:inherit}
.lang-wrap{position:relative}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:160px}
.lang-menu button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.lang-menu button[aria-selected="true"]{background:var(--accent-soft)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;width:min(520px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:641px){.modal-bg{align-items:center}}
/* phones */
@media (max-width:640px){
  input,select,textarea{font-size:16px}
  .bar{gap:8px;padding-block:10px}
  .brand{font-size:20px}.brand small{font-size:10.5px}
  nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;gap:0;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-bottom:0;border-radius:10px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0}
  nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
  nav.tabs .t-ic{display:block}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:26px}h2{font-size:23px}
  .big{font-size:46px}
}
</style>

<header class="app">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#/" data-nav>
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 11.5c3.5 1.5 7.5 1.5 11 0M4.5 16.5c3.5-1.5 7.5-1.5 11 0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="21" cy="6" r="3" fill="var(--jack)"/></svg>
        <span class="brand-txt"><span class="brand-name">SN Pétanque <small>Academy</small></span><span class="memorial">In loving memory of Steve Noel</span></span>
      </a>
      <div class="hdr-tools" id="hdrtools"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="muted">Loading…</div></main>
<div id="modal"></div>
<div id="toast" hidden class="toast" role="status" aria-live="polite"></div>

<script src="content/00-core.js"></script>
<script src="content/10-entry.js"></script>
<script src="content/20-beginners.js"></script>
<script src="content/30-intermediate.js"></script>
<script src="content/40-expert.js"></script>
<script src="content/50-pro.js"></script>
<script src="app.js"></script>
